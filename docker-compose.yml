# Secrets come from a root .env (see .env.example). No hardcoded credentials.
# Required: POSTGRES_PASSWORD, JWT_SECRET, KMS_DATA_KEY. Compose fails without them.

services:
  postgres:
    image: postgres:15
    container_name: pulsepay_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    # host port 5433 (5432 may be taken by another local postgres); internal stays 5432
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway database for the backend's database tests (data lives in memory):
  #   docker compose --profile test up -d postgres-test   then   cd backend && npm run test:db
  postgres-test:
    image: postgres:15
    profiles: ["test"]
    container_name: pulsepay_testdb
    environment:
      POSTGRES_USER: pulsepay_test
      POSTGRES_PASSWORD: pulsepay_test
      POSTGRES_DB: pulsepay_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsepay_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      KMS_DATA_KEY: ${KMS_DATA_KEY:?set in .env (64 hex chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-test_sid}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-test_token}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-+10000000000}
      BIOMETRIC_MATCH_THRESHOLD: ${BIOMETRIC_MATCH_THRESHOLD:-0.86}
      PER_PAYMENT_LIMIT_CENTS: ${PER_PAYMENT_LIMIT_CENTS:-10000}
      MAX_BALANCE_CENTS: ${MAX_BALANCE_CENTS:-20000}
      MIN_FUND_CENTS: ${MIN_FUND_CENTS:-1000}
      DISTRESS_CAP_CENTS: ${DISTRESS_CAP_CENTS:-2500}
      PAY_SESSION_TTL: ${PAY_SESSION_TTL:-120}
      DEMO_SHOW_OTP: ${DEMO_SHOW_OTP:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYOUT_MODE: ${PAYOUT_MODE:-manual}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-zai.glm-5.3}
      BEDROCK_FALLBACK_MODEL_ID: ${BEDROCK_FALLBACK_MODEL_ID:-zai.glm-5}
      ZAPIER_WEBHOOK_URL: ${ZAPIER_WEBHOOK_URL:-}
      ELASTIC_URL: ${ELASTIC_URL:-}
      ELASTIC_API_KEY: ${ELASTIC_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => { r.statusCode === 200 ? process.exit(0) : process.exit(1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    # migrate.js brings an existing database volume up to the current schema.
    command: sh -c "node scripts/migrate.js && node server.js"

  # CV / inference plane (camera frame -> vector). No public ingress in production.
  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    container_name: pulsepay_cv_service
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LIVENESS_THRESHOLD: "0.5"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsepay_frontend
    environment:
      # The browser talks to host-mapped ports; localhost defaults in lib/api.ts also work.
      VITE_API_URL: http://localhost:5000
      VITE_CV_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      cv-service:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
